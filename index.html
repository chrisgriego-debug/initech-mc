<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mission Control</title><meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Mission Control">
<meta name="theme-color" content="#1f3a60">
<style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1f2a33;font:16px -apple-system,Helvetica,Arial,sans-serif;color:#eef2f4}
form{background:#2c3a45;padding:28px;border-radius:12px;width:min(320px,88vw);display:flex;flex-direction:column;gap:12px;border-top:4px solid #0e5e5a}
h1{margin:0;font-size:19px;letter-spacing:.05em}input[type=password]{font-size:16px;padding:10px;border-radius:6px;border:0}
button{font-size:16px;padding:10px;border:0;border-radius:6px;background:#0e5e5a;color:#fff;font-weight:600}#err{color:#ff8a8a;min-height:1em;font-size:13px}label{font-size:14px}</style>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');</script></head>
<body><form id="f"><h1>INITECH MISSION CONTROL</h1>
<input id="pw" type="password" placeholder="Password" autocomplete="current-password" autofocus>
<label><input id="rem" type="checkbox" checked> Remember me on this device</label>
<button id="go">Unlock</button><div id="err"></div>
<a href="#" id="out" style="color:#a9b6bf;font-size:12px;display:none">Forget this device</a></form>
<script>
const SALT=Uint8Array.from(atob("elege8Scktgfk0JjEnzfvg=="),c=>c.charCodeAt(0)),ITER=600000;
const b64=u=>btoa(String.fromCharCode(...new Uint8Array(u))),unb=s=>Uint8Array.from(atob(s.trim()),c=>c.charCodeAt(0));
async function dec(raw,txt){const k=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);const b=unb(txt);
 return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(0,12)},k,b.slice(12)))}
async function open_(raw){const t=await (await fetch('app.enc?t='+Date.now(),{cache:'no-store'})).text();const html=await dec(raw,t);
 document.open();document.write(html);document.close()}
async function derive(pw){const m=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
 return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:SALT,iterations:ITER,hash:'SHA-256'},m,256))}
document.getElementById('f').onsubmit=async e=>{e.preventDefault();const err=document.getElementById('err');err.textContent='Unlocking…';
 try{const raw=await derive(document.getElementById('pw').value);await dec(raw,await (await fetch('data.enc?t='+Date.now(),{cache:'no-store'})).text());
  const k=b64(raw);sessionStorage.setItem('mc_key',k);if(document.getElementById('rem').checked)localStorage.setItem('mc_key',k);else localStorage.removeItem('mc_key');
  await open_(raw)}catch(x){err.textContent='Wrong password.'}};
document.getElementById('out').onclick=e=>{e.preventDefault();localStorage.removeItem('mc_key');sessionStorage.removeItem('mc_key');location.reload()};
const saved=localStorage.getItem('mc_key')||sessionStorage.getItem('mc_key');
if(saved){document.getElementById('out').style.display='';open_(unb(saved)).catch(()=>{document.getElementById('err').textContent='Saved login expired. Enter password.'})}
</script></body></html>
